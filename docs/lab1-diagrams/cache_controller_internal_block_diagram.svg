<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffffff"/>
    </marker>
    <marker id="arrowSmall" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ffffff"/>
    </marker>
    <style>
      .bg { fill:#000000; }
      .box { fill:#000000; stroke:#ffffff; stroke-width:3; }
      .box2 { fill:#000000; stroke:#ffffff; stroke-width:2; }
      .line { stroke:#ffffff; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .lineS { stroke:#ffffff; stroke-width:2.5; fill:none; marker-end:url(#arrowSmall); }
      .plain { stroke:#ffffff; stroke-width:2.5; fill:none; }
      .title { fill:#ffffff; font-family:Arial,Helvetica,sans-serif; font-size:26px; font-weight:bold; }
      .head { fill:#ffffff; font-family:Arial,Helvetica,sans-serif; font-size:18px; font-weight:bold; }
      .txt { fill:#ffffff; font-family:Arial,Helvetica,sans-serif; font-size:15px; }
      .small { fill:#ffffff; font-family:Arial,Helvetica,sans-serif; font-size:13px; }
      .tiny { fill:#ffffff; font-family:Arial,Helvetica,sans-serif; font-size:11px; }
      .section { fill:#ffffff; font-family:Arial,Helvetica,sans-serif; font-size:16px; font-weight:bold; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1200"/>

  <!-- Title -->
  <text class="title" x="900" y="42" text-anchor="middle">CACHE CONTROLLER — INTERNAL BLOCK DIAGRAM</text>
  <text class="small" x="900" y="67" text-anchor="middle">16-bit address: Tag [15:8] · Index [7:5] · Offset [4:0] · 8 cache lines × 32 bytes</text>

  <!-- External interfaces -->
  <rect class="box" x="35" y="145" width="250" height="300" rx="8"/>
  <text class="head" x="160" y="178" text-anchor="middle">CPU</text>
  <text class="small" x="160" y="203" text-anchor="middle">External interface</text>
  <line class="plain" x1="55" y1="220" x2="265" y2="220"/>
  <text class="txt" x="60" y="250">ADD[15:0]</text>
  <text class="txt" x="60" y="280">WR/RD</text>
  <text class="txt" x="60" y="310">CS</text>
  <text class="txt" x="60" y="340">DOUT[7:0] → write data</text>
  <text class="txt" x="60" y="370">DOUT[7:0] ← read data</text>
  <text class="txt" x="60" y="400">RDY</text>
  <text class="txt" x="60" y="430">CLK</text>

  <rect class="box" x="1515" y="145" width="250" height="300" rx="8"/>
  <text class="head" x="1640" y="178" text-anchor="middle">SDRAM CONTROLLER</text>
  <text class="small" x="1640" y="203" text-anchor="middle">External interface</text>
  <line class="plain" x1="1535" y1="220" x2="1745" y2="220"/>
  <text class="txt" x="1540" y="250">ADD[15:0]</text>
  <text class="txt" x="1540" y="280">WR/RD</text>
  <text class="txt" x="1540" y="310">MEMSTRB</text>
  <text class="txt" x="1540" y="340">DIN[7:0]</text>
  <text class="txt" x="1540" y="370">DOUT[7:0]</text>
  <text class="txt" x="1540" y="400">CLK</text>

  <!-- Main cache controller boundary -->
  <rect class="box" x="320" y="105" width="1160" height="1000" rx="12"/>
  <text class="head" x="900" y="137" text-anchor="middle">CACHE CONTROLLER</text>

  <!-- Address register / splitter -->
  <rect class="box2" x="365" y="170" width="1070" height="105" rx="6"/>
  <text class="section" x="900" y="195" text-anchor="middle">ADDRESS WORD REGISTER / ADDRESS SPLITTER</text>

  <rect class="box2" x="390" y="215" width="270" height="38"/>
  <rect class="box2" x="660" y="215" width="285" height="38"/>
  <rect class="box2" x="945" y="215" width="465" height="38"/>
  <text class="txt" x="525" y="240" text-anchor="middle">TAG [15:8] — 8 b</text>
  <text class="txt" x="802" y="240" text-anchor="middle">INDEX [7:5] — 3 b</text>
  <text class="txt" x="1177" y="240" text-anchor="middle">OFFSET [4:0] — 5 b</text>

  <!-- Address split lines -->
  <path class="lineS" d="M525 253 L525 315 L530 315"/>
  <path class="lineS" d="M802 253 L802 315"/>
  <path class="lineS" d="M1177 253 L1177 315 L1230 315"/>

  <!-- Metadata -->
  <rect class="box2" x="365" y="315" width="300" height="220" rx="6"/>
  <text class="section" x="515" y="342" text-anchor="middle">CACHE METADATA</text>

  <rect class="box2" x="390" y="360" width="250" height="45" rx="4"/>
  <text class="txt" x="515" y="389" text-anchor="middle">TAG MEM — 8 × 8 b</text>
  <rect class="box2" x="390" y="415" width="250" height="45" rx="4"/>
  <text class="txt" x="515" y="444" text-anchor="middle">VALID — 8 × 1 b</text>
  <rect class="box2" x="390" y="470" width="250" height="45" rx="4"/>
  <text class="txt" x="515" y="499" text-anchor="middle">DIRTY — 8 × 1 b</text>

  <!-- Comparator -->
  <rect class="box2" x="710" y="315" width="330" height="220" rx="6"/>
  <text class="section" x="875" y="342" text-anchor="middle">HIT / MISS LOGIC</text>
  <text class="txt" x="875" y="380" text-anchor="middle">Tag[15:8] == stored tag</text>
  <text class="txt" x="875" y="410" text-anchor="middle">AND VALID[index]</text>
  <line class="plain" x1="745" y1="430" x2="1005" y2="430"/>
  <text class="txt" x="875" y="458" text-anchor="middle">HIT → read / write procedure</text>
  <text class="txt" x="875" y="488" text-anchor="middle">MISS → inspect DIRTY[index]</text>
  <text class="small" x="875" y="515" text-anchor="middle">hit / miss + dirty status</text>

  <!-- FSM -->
  <rect class="box2" x="1085" y="315" width="350" height="220" rx="6"/>
  <text class="section" x="1260" y="342" text-anchor="middle">CONTROL FSM</text>
  <text class="txt" x="1260" y="378" text-anchor="middle">IDLE / HIT_READ / HIT_WRITE</text>
  <text class="txt" x="1260" y="408" text-anchor="middle">MISS_CLEAN / MISS_DIRTY</text>
  <text class="txt" x="1260" y="438" text-anchor="middle">WRITEBACK / FETCH</text>
  <text class="txt" x="1260" y="468" text-anchor="middle">COMPLETE</text>
  <line class="plain" x1="1120" y1="485" x2="1400" y2="485"/>
  <text class="small" x="1260" y="512" text-anchor="middle">controls muxes, WEN, metadata, RDY</text>

  <!-- Internal SRAM -->
  <rect class="box2" x="365" y="620" width="420" height="280" rx="6"/>
  <text class="section" x="575" y="650" text-anchor="middle">LOCAL CACHE SRAM / BLOCKRAM</text>
  <text class="small" x="575" y="674" text-anchor="middle">256 × 8 b = 8 blocks × 32 bytes</text>

  <rect class="box2" x="395" y="705" width="160" height="120" rx="4"/>
  <text class="txt" x="475" y="730" text-anchor="middle">ADD[7:0]</text>
  <text class="txt" x="475" y="765" text-anchor="middle">WEN</text>
  <text class="txt" x="475" y="800" text-anchor="middle">DIN[7:0]</text>

  <rect class="box2" x="595" y="705" width="160" height="120" rx="4"/>
  <text class="txt" x="675" y="748" text-anchor="middle">BLOCKRAM</text>
  <text class="small" x="675" y="775" text-anchor="middle">storage</text>
  <text class="txt" x="675" y="802" text-anchor="middle">DOUT[7:0]</text>

  <!-- Muxes -->
  <rect class="box2" x="830" y="620" width="250" height="130" rx="6"/>
  <text class="section" x="955" y="648" text-anchor="middle">WRITE-DATA MUX</text>
  <text class="txt" x="955" y="680" text-anchor="middle">2:1</text>
  <text class="small" x="955" y="704" text-anchor="middle">CPU write data</text>
  <text class="small" x="955" y="725" text-anchor="middle">SDRAM fetch data</text>

  <rect class="box2" x="830" y="795" width="250" height="130" rx="6"/>
  <text class="section" x="955" y="823" text-anchor="middle">READ-DATA MUX</text>
  <text class="txt" x="955" y="855" text-anchor="middle">1:2</text>
  <text class="small" x="955" y="879" text-anchor="middle">→ CPU on read hit</text>
  <text class="small" x="955" y="900" text-anchor="middle">→ SDRAM on write-back</text>

  <!-- Transfer/address logic -->
  <rect class="box2" x="1110" y="620" width="325" height="305" rx="6"/>
  <text class="section" x="1272" y="648" text-anchor="middle">BLOCK-TRANSFER LOGIC</text>
  <text class="txt" x="1272" y="680" text-anchor="middle">32-byte burst / word counter</text>
  <text class="txt" x="1272" y="708" text-anchor="middle">MEMSTRB sequencing</text>
  <text class="txt" x="1272" y="736" text-anchor="middle">SRAM WEN control</text>
  <line class="plain" x1="1140" y1="755" x2="1405" y2="755"/>
  <text class="section" x="1272" y="785" text-anchor="middle">ADDRESS GENERATOR</text>
  <text class="txt" x="1272" y="815" text-anchor="middle">New: [newTag &amp; Index &amp; 00000]</text>
  <text class="txt" x="1272" y="843" text-anchor="middle">Old: [oldTag &amp; Index &amp; 00000]</text>
  <text class="small" x="1272" y="875" text-anchor="middle">increment address / offset for 32 words</text>
  <text class="small" x="1272" y="900" text-anchor="middle">WR/RD + MEMSTRB + ADD[15:0]</text>

  <!-- Control/data connections -->
  <path class="lineS" d="M525 253 L525 360"/>
  <path class="lineS" d="M802 253 L802 360 L640 360"/>
  <path class="lineS" d="M802 360 L875 360"/>
  <path class="lineS" d="M802 360 L802 705 L595 705"/>
  <path class="lineS" d="M1177 253 L1177 315"/>
  <path class="lineS" d="M640 382 L710 382"/>
  <path class="lineS" d="M640 437 L710 437"/>
  <path class="lineS" d="M640 492 L710 492"/>
  <path class="lineS" d="M1040 390 L1085 390"/>
  <path class="lineS" d="M1040 490 L1085 490"/>

  <!-- Metadata writeback from FSM -->
  <path class="lineS" d="M1260 535 L1260 570 L515 570 L515 515"/>
  <text class="tiny" x="750" y="562" text-anchor="middle">tag / valid / dirty updates</text>

  <!-- Index+offset to SRAM address -->
  <path class="line" d="M1177 253 L1177 590 L475 590 L475 705"/>
  <text class="tiny" x="800" y="584" text-anchor="middle">INDEX &amp; OFFSET → SRAM ADD[7:0]</text>

  <!-- CPU data into write mux -->
  <path class="line" d="M285 340 L325 340 L325 665 L830 665"/>
  <text class="tiny" x="430" y="654">CPU write data</text>

  <!-- SDRAM data into write mux -->
  <path class="line" d="M1515 370 L1475 370 L1475 615 L1055 615 L1055 690 L1080 690"/>
  <text class="tiny" x="1320" y="607">SDRAM DOUT[7:0]</text>

  <!-- Write mux to SRAM DIN -->
  <path class="line" d="M830 705 L755 705 L755 800 L555 800"/>
  <text class="tiny" x="760" y="720" text-anchor="end">selected DIN</text>

  <!-- SRAM DOUT to read mux -->
  <path class="line" d="M755 802 L830 802"/>
  <text class="tiny" x="790" y="790" text-anchor="middle">DOUT</text>

  <!-- Read mux to CPU -->
  <path class="line" d="M830 885 L745 885 L745 1000 L305 1000 L305 370 L285 370"/>
  <text class="tiny" x="520" y="990">cache read data → CPU</text>

  <!-- Read mux to SDRAM DIN -->
  <path class="line" d="M1080 885 L1475 885 L1475 340 L1515 340"/>
  <text class="tiny" x="1290" y="875">write-back data → SDRAM DIN</text>

  <!-- Block transfer to SDRAM -->
  <path class="line" d="M1435 700 L1490 700 L1490 250 L1515 250"/>
  <text class="tiny" x="1450" y="690">ADD[15:0]</text>
  <path class="line" d="M1435 735 L1465 735 L1465 280 L1515 280"/>
  <text class="tiny" x="1438" y="726">WR/RD</text>
  <path class="line" d="M1435 770 L1440 770 L1440 310 L1515 310"/>
  <text class="tiny" x="1415" y="760">MEMSTRB</text>

  <!-- Block transfer to SRAM WEN -->
  <path class="line" d="M1110 735 L1090 735 L1090 965 L475 965 L475 825"/>
  <text class="tiny" x="860" y="957">WEN during block fetch</text>

  <!-- FSM control lines -->
  <path class="lineS" d="M1085 425 L1060 425 L1060 650 L1080 650"/>
  <text class="tiny" x="1070" y="540" text-anchor="end">mux select</text>
  <path class="lineS" d="M1435 450 L1450 450 L1450 650"/>
  <text class="tiny" x="1455" y="555">transfer control</text>
  <path class="lineS" d="M1260 535 L1260 620"/>
  <text class="tiny" x="1275" y="580">control</text>

  <!-- RDY -->
  <path class="line" d="M1085 500 L1030 500 L1030 1040 L305 1040 L305 400 L285 400"/>
  <text class="tiny" x="500" y="1032">RDY = 1 when idle / transaction complete; RDY = 0 during miss/transfer</text>

  <!-- Clock -->
  <path class="plain" d="M160 430 L160 1090 L900 1090"/>
  <text class="small" x="180" y="1083">CLK — common synchronous clock</text>

  <!-- Legend -->
  <rect class="box2" x="365" y="955" width="1070" height="105" rx="6"/>
  <text class="section" x="390" y="980">Behavior represented by the controller</text>
  <text class="small" x="390" y="1004">1. Write hit → SRAM write; VALID=1, DIRTY=1</text>
  <text class="small" x="390" y="1026">2. Read hit → SRAM read; data → CPU</text>
  <text class="small" x="830" y="1004">3. Miss + clean → fetch 32 B, replace tag, VALID=1, then complete request</text>
  <text class="small" x="830" y="1026">4. Miss + dirty → write back old block, fetch new 32 B, replace tag, then complete request</text>

  <!-- Port labels near boundary -->
  <text class="tiny" x="330" y="300">metadata / control</text>
  <text class="tiny" x="1468" y="300" text-anchor="end">external memory interface</text>
</svg>
