<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400">
<defs>
<marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L16 8 L0 16 Z" fill="#fff"/></marker>
<marker id="arrs" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5.5 L0 11 Z" fill="#fff"/></marker>
<style>
.bg{fill:#000}.outer{fill:#000;stroke:#fff;stroke-width:4}.box{fill:#000;stroke:#fff;stroke-width:3}.sub{fill:#000;stroke:#fff;stroke-width:2.5}.bus{fill:none;stroke:#fff;stroke-width:3.5;marker-end:url(#arrow)}.ctrl{fill:none;stroke:#fff;stroke-width:2.4;marker-end:url(#arrs)}.plain{fill:none;stroke:#fff;stroke-width:2.2}
.t{fill:#fff;font:700 34px Arial,Helvetica,sans-serif}.h{fill:#fff;font:700 19px Arial,Helvetica,sans-serif}.h2{fill:#fff;font:700 16px Arial,Helvetica,sans-serif}.p{fill:#fff;font:16px Arial,Helvetica,sans-serif}.s{fill:#fff;font:14px Arial,Helvetica,sans-serif}.xs{fill:#fff;font:12px Arial,Helvetica,sans-serif}
</style></defs><rect class="bg" width="100%" height="100%"/><text class="t" x="1200" y="46" text-anchor="middle">CACHE CONTROLLER — INTERNAL BLOCK DIAGRAM</text><text class="s" x="1200" y="74" text-anchor="middle">Internal logic for 16-bit CPU address, 8 cache entries, 32-byte blocks</text><rect class="outer" x="300" y="105" width="1800" height="1190" rx="14"/><text class="h" x="1200" y="139" text-anchor="middle">CACHE CONTROLLER</text><rect class="box" x="515" y="175" width="1370" height="155" rx="10"/><text class="h" x="1200.0" y="209" text-anchor="middle">ADDRESS WORD REGISTER / SPLITTER</text><text class="s" x="1200.0" y="231" text-anchor="middle">AWR</text><line class="plain" x1="537" y1="249" x2="1863" y2="249"/><rect class="sub" x="545" y="255" width="420" height="46" rx="5"/><text class="p" x="755.0" y="284.0" text-anchor="middle">TAG [15:8] — 8 b</text><rect class="sub" x="965" y="255" width="350" height="46" rx="5"/><text class="p" x="1140.0" y="284.0" text-anchor="middle">INDEX [7:5] — 3 b</text><rect class="sub" x="1315" y="255" width="540" height="46" rx="5"/><text class="p" x="1585.0" y="284.0" text-anchor="middle">OFFSET [4:0] — 5 b</text><rect class="box" x="420" y="400" width="440" height="275" rx="10"/><text class="h" x="640.0" y="434" text-anchor="middle">CACHE METADATA</text><text class="s" x="640.0" y="456" text-anchor="middle">8 entries each</text><line class="plain" x1="442" y1="474" x2="838" y2="474"/><rect class="sub" x="455" y="500" width="370" height="43" rx="5"/><text class="p" x="640.0" y="527.5" text-anchor="middle">TAG MEM — 8 × 8 b</text><rect class="sub" x="455" y="555" width="370" height="43" rx="5"/><text class="p" x="640.0" y="582.5" text-anchor="middle">VALID — 8 × 1 b</text><rect class="sub" x="455" y="610" width="370" height="43" rx="5"/><text class="p" x="640.0" y="637.5" text-anchor="middle">DIRTY — 8 × 1 b</text><rect class="box" x="940" y="400" width="440" height="275" rx="10"/><text class="h" x="1160.0" y="434" text-anchor="middle">HIT / MISS LOGIC</text><text class="s" x="1160.0" y="456" text-anchor="middle">tag compare + valid check</text><line class="plain" x1="962" y1="474" x2="1358" y2="474"/><text class="p" x="1160" y="490" text-anchor="middle">TAG[15:8] = stored tag</text><text class="p" x="1160" y="525" text-anchor="middle">AND VALID[index]</text><line class="plain" x1="980" y1="548" x2="1340" y2="548"/><text class="p" x="1160" y="590" text-anchor="middle">HIT → local access</text><text class="p" x="1160" y="625" text-anchor="middle">MISS → check DIRTY[index]</text><text class="s" x="1160" y="654" text-anchor="middle">HIT/MISS + DIRTY</text><rect class="box" x="1460" y="400" width="500" height="275" rx="10"/><text class="h" x="1710.0" y="434" text-anchor="middle">CONTROL FSM</text><text class="s" x="1710.0" y="456" text-anchor="middle">transaction sequencing</text><line class="plain" x1="1482" y1="474" x2="1938" y2="474"/><text class="p" x="1710" y="488" text-anchor="middle">IDLE</text><text class="p" x="1710" y="522" text-anchor="middle">HIT_READ / HIT_WRITE</text><text class="p" x="1710" y="556" text-anchor="middle">MISS_CLEAN / MISS_DIRTY</text><text class="p" x="1710" y="590" text-anchor="middle">WRITEBACK / FETCH</text><text class="p" x="1710" y="624" text-anchor="middle">COMPLETE</text><line class="plain" x1="1500" y1="646" x2="1920" y2="646"/><text class="s" x="1710" y="666" text-anchor="middle">mux select • WEN • metadata • RDY</text><rect class="box" x="420" y="745" width="440" height="365" rx="10"/><text class="h" x="640.0" y="779" text-anchor="middle">LOCAL CACHE SRAM / BLOCKRAM</text><text class="s" x="640.0" y="801" text-anchor="middle">256 × 8 b</text><line class="plain" x1="442" y1="819" x2="838" y2="819"/><text class="p" x="640" y="820" text-anchor="middle">ADD[7:0]</text><text class="p" x="640" y="858" text-anchor="middle">WEN</text><text class="p" x="640" y="896" text-anchor="middle">DIN[7:0]</text><line class="plain" x1="455" y1="925" x2="825" y2="925"/><text class="h2" x="640" y="965" text-anchor="middle">BLOCKRAM STORAGE</text><text class="p" x="640" y="1008" text-anchor="middle">DOUT[7:0]</text><text class="s" x="640" y="1055" text-anchor="middle">Index selects cache line  •  Offset selects byte</text><rect class="box" x="935" y="745" width="445" height="165" rx="10"/><text class="h" x="1157.5" y="779" text-anchor="middle">WRITE-DATA MUX</text><text class="s" x="1157.5" y="801" text-anchor="middle">2 : 1</text><line class="plain" x1="957" y1="819" x2="1358" y2="819"/><text class="p" x="1157" y="835" text-anchor="middle">CPU DOUT / SDRAM DOUT → SRAM DIN</text><rect class="box" x="935" y="945" width="445" height="165" rx="10"/><text class="h" x="1157.5" y="979" text-anchor="middle">READ-DATA MUX</text><text class="s" x="1157.5" y="1001" text-anchor="middle">1 : 2</text><line class="plain" x1="957" y1="1019" x2="1358" y2="1019"/><text class="p" x="1157" y="1025" text-anchor="middle">SRAM DOUT → CPU DIN   OR   SDRAM DIN</text><rect class="box" x="1460" y="745" width="500" height="365" rx="10"/><text class="h" x="1710.0" y="779" text-anchor="middle">BLOCK-TRANSFER LOGIC</text><text class="s" x="1710.0" y="801" text-anchor="middle">32-byte block sequencing</text><line class="plain" x1="1482" y1="819" x2="1938" y2="819"/><text class="p" x="1710" y="825" text-anchor="middle">32-word counter</text><text class="p" x="1710" y="860" text-anchor="middle">MEMSTRB sequencing</text><text class="p" x="1710" y="895" text-anchor="middle">SRAM WEN during FETCH</text><line class="plain" x1="1500" y1="920" x2="1920" y2="920"/><text class="h2" x="1710" y="962" text-anchor="middle">SDRAM: ADD[15:0] • WR/RD • MEMSTRB</text><text class="p" x="1710" y="1002" text-anchor="middle">32 transfers per block</text><text class="s" x="1710" y="1042" text-anchor="middle">WRITEBACK uses SRAM DOUT</text><rect class="box" x="1460" y="1160" width="500" height="100" rx="10"/><text class="h" x="1710.0" y="1194" text-anchor="middle">ADDRESS GENERATOR</text><text class="s" x="1710.0" y="1216" text-anchor="middle">block base addresses</text><line class="plain" x1="1482" y1="1234" x2="1938" y2="1234"/><text class="s" x="1710" y="1209" text-anchor="middle">NEW [newTag & Index & 00000]   /   OLD [oldTag & Index & 00000]</text><text class="s" x="1710" y="1238" text-anchor="middle">increment through block</text><path class="ctrl" d="M 755 301 L 755 350 L 640 350 L 640 400"/><text class="xs" x="700" y="342" text-anchor="middle">TAG</text><path class="ctrl" d="M 1140 301 L 1140 350 L 640 350 L 640 400"/><text class="xs" x="1070" y="342" text-anchor="middle">INDEX</text><path class="ctrl" d="M 1140 350 L 1160 350 L 1160 400"/><text class="xs" x="1180" y="342" text-anchor="middle">INDEX</text><path class="ctrl" d="M 1585 301 L 1585 350 L 1710 350 L 1710 400"/><text class="xs" x="1625" y="342" text-anchor="middle">OFFSET</text><path class="bus" d="M 1140 301 L 1140 710 L 640 710 L 640 820"/><text class="xs" x="885" y="698" text-anchor="middle">INDEX & OFFSET → ADD[7:0]</text><path class="ctrl" d="M 825 520 L 940 520"/><text class="xs" x="882" y="505" text-anchor="middle">TAG</text><path class="ctrl" d="M 825 576 L 940 576"/><text class="xs" x="882" y="561" text-anchor="middle">VALID</text><path class="ctrl" d="M 825 632 L 900 632 L 900 612 L 940 612"/><text class="xs" x="882" y="650" text-anchor="middle">DIRTY</text><path class="ctrl" d="M 1380 520 L 1460 520"/><text class="xs" x="1420" y="504" text-anchor="middle">HIT / MISS</text><path class="ctrl" d="M 1380 612 L 1460 612"/><text class="xs" x="1420" y="596" text-anchor="middle">DIRTY</text><path class="ctrl" d="M 1565 675 L 1565 710 L 1160 710 L 1160 745"/><text class="xs" x="1360" y="698" text-anchor="middle">MUX SELECT</text><path class="ctrl" d="M 1760 675 L 1760 715 L 1710 715 L 1710 745"/><text class="xs" x="1795" y="700" text-anchor="middle">TRANSFER CONTROL</text><path class="ctrl" d="M 1660 675 L 1660 700 L 405 700 L 405 578 L 420 578"/><text class="xs" x="1020" y="688" text-anchor="middle">TAG / VALID / DIRTY updates</text><path class="ctrl" d="M 1510 895 L 1470 895 L 1470 935 L 900 935 L 900 858 L 640 858"/><text class="xs" x="1260" y="922" text-anchor="middle">WEN</text><path class="bus" d="M 935 835 L 860 835 L 860 896 L 640 896"/><text class="xs" x="845" y="820" text-anchor="middle">DIN[7:0]</text><path class="bus" d="M 860 1008 L 935 1008"/><text class="xs" x="897" y="992" text-anchor="middle">DOUT[7:0]</text><path class="ctrl" d="M 1710 1110 L 1710 1160"/><text class="xs" x="1745" y="1142" text-anchor="start">base / increment</text><path class="bus" d="M 290 735 L 390 735 L 390 230 L 515 230"/><text class="xs" x="322" y="721" text-anchor="start">ADD[15:0]</text><path class="ctrl" d="M 290 805 L 365 805 L 365 365 L 1840 365 L 1840 400"/><text class="xs" x="380" y="350" text-anchor="start">WR/RD + CS</text><path class="bus" d="M 290 855 L 345 855 L 345 788 L 935 788"/><text class="xs" x="510" y="774" text-anchor="middle">DOUT[7:0]</text><path class="bus" d="M 935 1035 L 885 1035 L 885 1140 L 350 1140 L 350 900 L 290 900"/><text class="xs" x="520" y="1127" text-anchor="middle">DIN[7:0]</text><path class="ctrl" d="M 1900 675 L 2050 675 L 2050 1270 L 330 1270 L 330 945 L 290 945"/><text class="xs" x="350" y="1258" text-anchor="start">RDY</text><path class="bus" d="M 1960 962 L 2105 962 L 2105 730 L 2310 730"/><text class="xs" x="2160" y="716" text-anchor="middle">ADD[15:0]</text><path class="ctrl" d="M 1960 1002 L 2115 1002 L 2115 775 L 2310 775"/><text class="xs" x="2165" y="761" text-anchor="middle">WR/RD</text><path class="ctrl" d="M 1960 1042 L 2125 1042 L 2125 810 L 2310 810"/><text class="xs" x="2175" y="796" text-anchor="middle">MEMSTRB</text><path class="bus" d="M 1380 1035 L 2220 1035 L 2220 855 L 2310 855"/><text class="xs" x="2080" y="1022" text-anchor="middle">DIN[7:0]</text><path class="bus" d="M 2310 900 L 2260 900 L 2260 350 L 900 350 L 900 825 L 935 825"/><text class="xs" x="2150" y="336" text-anchor="middle">DOUT[7:0]</text><text class="s" x="1200" y="1320" text-anchor="middle">VALID=1 → cached block is usable   •   DIRTY=1 → cached data must be written back before replacement</text><text class="s" x="1200" y="1348" text-anchor="middle">Miss path: clean → FETCH 32 B   |   dirty → WRITEBACK old block → FETCH new block → complete requested hit procedure</text></svg>